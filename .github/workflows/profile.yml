name: Profile assets

# Renders the stats card and the contribution snake, then publishes them
# to the `output` branch that README.md reads from.

on:
  schedule:
    - cron: "17 3 * * *" # every day, 08:17 Tashkent time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/fonts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render stats card
        run: python3 scripts/render.py stats --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#BF6A0A&color_dots=#ebedf0,#fbe3c4,#f5bd73,#e28413,#9a5208
            dist/snake-dark.svg?color_snake=#E28413&color_dots=#161b22,#3d2508,#7a4709,#c46f0e,#f3a54a

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: refresh profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
